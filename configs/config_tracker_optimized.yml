%YAML:1.0
################################################################################
# NVIDIA DeepStream 6.0 NvDCF Tracker Configuration (optimized for Jetson Nano)
# Reference: /opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvDCF_perf.yml
################################################################################

BaseConfig:
  minDetectorConfidence: 0.25
  minMatchingScore4Overall: 0.35
  minMatchingScore4Size: 0.40
  minMatchingScore4Iou: 0.30
  matchingScoreWeight4Visual: 0.60
  matchingScoreWeight4Size: 0.20
  matchingScoreWeight4Iou: 0.20

TargetManagement:
  enableBboxUnClipping: 1
  maxTargetsPerStream: 100
  minTrackingConfidenceDuringInactive: 0.90
  maxShadowTrackingAge: 15
  probationAge: 2
  earlyTerminationAge: 1

StateEstimator:
  stateEstimatorType: 1
  kfProcessNoiseVar4Loc: 0.001
  kfProcessNoiseVar4Vel: 0.01
  kfMeasurementNoiseVar4Loc: 0.01

VisualTracker:
  visualTrackerType: 1
  useColorNames: 1
  useHog: 1
  featureImgSizeLevel: 2
  filterLr: 0.15
  gaussianSigma: 0.75
  searchRegionPaddingScale: 2.0
